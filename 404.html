<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — JeF</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFBFC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B4DF5'/%3E%3Cpath d='M8 9h4.4l3.6 10.2L19.6 9H24l-6.1 15h-3.8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0F1115;--muted:#5B616B;--line:#E5E7EB;--bg:#FBFBFC;--accent:#1B4DF5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,Helvetica,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;gap:1.5rem;
    background:radial-gradient(100% 100% at 50% 0%,#EEF2FF 0%,var(--bg) 60%);
    color:var(--ink);font-family:var(--font);text-align:center;padding:2rem;
    -webkit-font-smoothing:antialiased;
  }
  .brand{display:inline-flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.1rem;letter-spacing:-.03em}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .brand-mark svg{width:17px;height:17px}
  .brand-logo{height:40px;width:auto;display:block}
  .code{font-size:clamp(4.5rem,16vw,7rem);font-weight:700;letter-spacing:-.06em;line-height:1;margin:.5rem 0 0;color:var(--accent)}
  h1{font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:-.03em;margin:0}
  p{color:var(--muted);margin:0;max-width:34ch;font-size:.95rem;line-height:1.6}
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;margin-top:.5rem;
    background:var(--accent);color:#fff;padding:.85rem 1.35rem;border-radius:999px;
    font-size:.95rem;font-weight:600;text-decoration:none;
    box-shadow:0 10px 24px -12px rgba(27,77,245,.75);
  }
  .btn:hover{background:#1240DA}
  .btn svg{width:16px;height:16px}
</style>
</head>
<body>
  <a class="brand" href="/">
      <img class="brand-logo" src="/img/jef-wordmark.webp" alt="JeF — Fuerza y precisión" width="246" height="96">
    </a>

  <p class="code" aria-hidden="true">404</p>
  <h1>Esta ruta no existe</h1>
  <p>La página que buscas se ha movido o nunca estuvo aquí. Te llevamos de vuelta al inicio.</p>
  <a class="btn" href="/">
    Volver al inicio
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13m0 0-5-5m5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</body>
</html>
